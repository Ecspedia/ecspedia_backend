spring.application.name=ecspedia
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/ecspedia
spring.datasource.username=ecspedia
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true



#Lite API overrides
liteapi.api.base-url=https://api.liteapi.travel/v3.0
liteapi.api.key=${LITEAPI_API_KEY}


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email Templates
app.email.from=noreply@ecspedia.com
app.email.from.name=Ecspedia Team
app.email.base-url=${BASE_URL:http://localhost:3000}

spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true
#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:ecspedia-user-photos}
aws.s3.region=${AWS_REGION:us-east-2}
aws.s3.profile-photo-prefix=profile-photos/
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Google Custom Search (set via environment variables in production)
gemini.api.key=${GEMINI_API_KEY}

#Health & Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.mail.enabled=true

# Startup timeout for readiness probe
spring.lifecycle.timeout-per-shutdown-phase=30s